actions:
  apisYmlCreated: true
  apisListed: 4
  openapiDirectoryCreated: false
  reason: |
    Four real, live, anonymously accessible datasets were captured as apis[] entries
    with confirmed base URL and documentation. No OpenAPI exists to harvest, so no
    openapi/ directory was created and no spec pointers were fabricated. OSFI is
    recorded honestly as a prudential regulator with an open DATA surface, a
    gated FILING surface, no developer portal, and no ACORD posture.
