generated: '2026-07-25'
method: derived
source: live CKAN package_search / package_show / datastore_search responses on 2026-07-25; field lists
  in json-schema/
description: 'The entity graph behind OSFI''s public data. There is no OpenAPI to derive from, so this
  is derived from the live CKAN catalog structure plus the actual column sets returned by datastore_search.
  Two domains sit side by side: a REGISTER of supervised entities, and a long, narrow FACT table of regulatory-return
  data points.'
entities:
- name: Organization
  id: osfi-bsif
  description: The OSFI publisher on the Open Government Portal.
  read: https://open.canada.ca/data/en/api/3/action/organization_show?id=osfi-bsif
- name: Dataset
  key: package id (UUID)
  description: One supervised-sector grouping (Banks, Life insurance companies, …) or the Who we regulate
    register. 36 OSFI datasets exist; 9 carry datastore-active resources.
  read: https://open.canada.ca/data/en/api/3/action/package_show?id=<package_id>
- name: Resource
  key: resource id (UUID)
  description: One return series (M4, BA/BCAR, LF1, PC1, MI3, …) or one register file, as a CSV loaded
    into the CKAN datastore.
  read: https://open.canada.ca/data/en/api/3/action/resource_show?id=<resource_id>
  attributes:
  - datastore_active
  - format
  - name (bilingual)
- name: FinancialInstitution
  key: Id (institution identifier used across return series)
  description: A federally regulated financial institution. In the register it carries Company Name, FI
    Type Name, FI Group Name, FI Industry Name, Canadian Trade Company Name, Representative Name, address
    and Authorized Insurance Classes.
  schema: json-schema/osfi-who-we-regulate-financial-institutions.json
  resource_id: 945045fa-2de0-47d4-aad2-144d69467824
  records: 349
- name: PrivatePensionPlan
  key: Plan Registration Number
  description: A federally regulated private pension plan, with sponsor and administrator contact.
  schema: json-schema/osfi-who-we-regulate-private-pension-plans.json
  resource_id: 2282e8c7-f949-454d-9c34-b6a78d94b162
  records: 1002
- name: ReturnDataPoint
  key: Id + Return/Releve + Data Point Address + period
  description: 'One reported value. The FINDAT resources are a tall fact table: the institution (Id),
    the return (Return/Releve, Return Title), the cell within that return (Data Point Address + Data Point
    Address Label), the period (Fiscal Year + Fiscal Quarter, or Calendar Year + Calendar Month), and
    Measure Value.'
  schema: json-schema/osfi-financial-return-datapoint.json
  note: All columns are typed `text` by the datastore, including Measure Value.
relationships:
- from: Organization
  to: Dataset
  type: has_many
  via: owner_org
- from: Dataset
  to: Resource
  type: has_many
  via: resources[]
- from: Resource
  to: ReturnDataPoint
  type: has_many
  via: resource_id
- from: ReturnDataPoint
  to: FinancialInstitution
  type: belongs_to
  via: Id
  confidence: medium
  note: The register and the return series both carry an institution identity, but the register exposes
    it as Company Name while the return series expose 'Id'. Joining the two requires OSFI's per-dataset
    user manual / data dictionary.
- from: ReturnDataPoint
  to: ReportingConcept
  type: belongs_to
  via: Data Point Address/Adresse de point de donnee
  note: Cell addresses are defined by the financial reporting instructions; the terms they use are defined
    in vocabulary/osfi-vocabulary.yml.
periodicity:
  quarterly_series: Fiscal Year/Annee fiscale + Fiscal Quarter
  monthly_series: Calendar Year/Annee civile + Calendar Month/Mois civil
