aid: osfi
url: https://raw.githubusercontent.com/api-evangelist/osfi/refs/heads/main/apis.yml
name: OSFI
kind: company
description: The Office of the Superintendent of Financial Institutions (OSFI / BSIF) is Canada's federal
  prudential regulator, supervising more than 400 federally regulated financial institutions and over
  1,200 private pension plans. On the insurance side OSFI supervises federally regulated life insurance
  companies, property and casualty insurers, mortgage insurers and fraternal benefit societies for solvency
  and capital adequacy — issuing the LICAT, MCT and BAAT capital guidelines and collecting the LF1/LF2/LF3,
  PC1-PC4 and MI1-MI5 regulatory returns. It does NOT regulate market conduct; that sits with the provinces
  (FSRA in Ontario, AMF in Quebec), and Canada has no open-insurance mandate — Consumer-Driven Banking
  excludes insurance entirely. OSFI publishes no first-party developer portal and no OpenAPI — developer.osfi-bsif.gc.ca,
  api.osfi-bsif.gc.ca and docs.osfi-bsif.gc.ca do not resolve, and /developers, /api and /developer all
  return 404. Its real machine-readable surface is its insurance and banking regulatory data (FINDAT)
  plus the "Who we regulate" register, published as datastore-active datasets on Canada's Open Government
  portal and readable anonymously through the CKAN 3 Action API (datastore_search; the SQL passthrough
  datastore_search_sql is disabled on the portal) — OSFI ships a step-by-step API usage guide PDF with
  each dataset. The filing side (the Regulatory Reporting System) is institution-gated behind a Bank of
  Canada Connect login. Everything else is a documentation-and-rulebook corpus of 313 guidance-library
  pages and 142 financial reporting instruction pages.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
